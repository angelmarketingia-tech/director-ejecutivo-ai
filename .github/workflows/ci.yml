name: CI

# Corre en cada push a main y en cada Pull Request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (escritorio + móvil + seguridad)
        run: npm run e2e
